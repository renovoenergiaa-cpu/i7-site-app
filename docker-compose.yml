version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: i7_postgres
    restart: always
    environment:
      POSTGRES_USER: i7_user
      POSTGRES_PASSWORD: i7_password
      POSTGRES_DB: i7_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: i7_redis
    restart: always
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: i7_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: i7_master_key_super_secret_2026
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  minio:
    image: minio/minio
    container_name: i7_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: i7_admin
      MINIO_ROOT_PASSWORD: i7_minio_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  meili_data:
  minio_data:
